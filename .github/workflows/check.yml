name: Library qualification

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  library:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Select stable Rust
        run: |
          rustup update stable --no-self-update
          rustup default stable
      - name: Fetch verified upstream test assets
        run: python3 scripts/fetch-test-assets.py
      - name: Test features and API examples
        run: cargo test --locked --release --all-features
      - name: Verify crates.io publication readiness
        run: cargo publish --dry-run --locked
