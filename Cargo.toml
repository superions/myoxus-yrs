# SPDX-License-Identifier: MIT
# The unchanged upstream manifest is retained under upstream/yrs-0.28.0.toml.

[package]
edition = "2018"
name = "myoxus-yrs"
version = "0.28.0-myoxus.1"
authors = [
    "Kevin Jahns <kevin.jahns@pm.me>",
    "Bartosz Sypytkowski <b.sypytkowski@gmail.com>",
    "Daniel Scharf (Myoxus adaptations)",
]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = true
autobenches = false
description = "Myoxus-maintained Yrs fork with subdocument ownership fixes, selective undo clearing, deterministic object encoding and BigInt preservation"
homepage = "https://github.com/superions/myoxus-yrs"
readme = "README.md"
keywords = [
    "crdt",
    "yrs",
]
license = "MIT"
repository = "https://github.com/superions/myoxus-yrs"
include = ["Cargo.toml", "Cargo.lock", "LICENSE", "README.md", "CHANGELOG.md", "src/**", "tests/**", "benches/**", "docs/**", "upstream/**", "scripts/fetch-test-assets.py"]

[package.metadata.myoxus]
upstream-package = "yrs"
upstream-version = "0.28.0"
upstream-commit = "23b7f5693bbf9e7d26340c521ee8647f79bdfba2"
upstream-sha256 = "52c70dc8beca8666c77612a96889106ca3cd65318609721f464624ff79685da9"

[package.metadata.docs.rs]
all-features = true

[features]
default = []
small-client = []
sync = []
weak = []

[lib]
# Retain the Rust crate name so upstream examples and existing imports work.
name = "yrs"
path = "src/lib.rs"
doctest = true
bench = true
doc = true

[[bench]]
name = "benches"
path = "benches/benches.rs"
harness = false

[[bench]]
name = "id_set"
path = "benches/id_set.rs"
harness = false

[[bench]]
name = "serialization"
path = "benches/serialization.rs"
harness = false

[dependencies.arc-swap]
version = "1.9"

[dependencies.async-lock]
version = "3.4"

[dependencies.async-trait]
version = "0.1"

[dependencies.dashmap]
version = "6.2"

[dependencies.fastrand]
version = "2"
features = ["js"]

[dependencies.serde]
version = "1.0"
features = [
    "derive",
    "rc",
]

[dependencies.serde_json]
version = "1.0"

[dependencies.compact_str]
version = "=0.10.0"

[dependencies.smallvec]
version = "1.13"
features = [
    "union",
    "const_generics",
    "const_new",
]

[dependencies.thiserror]
version = "2"

[dev-dependencies.assert_matches2]
version = "0.1"

[dev-dependencies.criterion]
version = "0.8"

[dev-dependencies.flate2]
version = "1"

[dev-dependencies.proptest]
version = "1.11"

[dev-dependencies.proptest-derive]
version = "0.8.0"

[dev-dependencies.ropey]
version = "1.6.0"

[dev-dependencies.uuid]
version = "1.26"

# Keep upstream crate tests independently runnable from both consumer workspaces.
[workspace]

# Match the consuming workspaces: standard diagnostics omit debug symbols.
[profile.dev]
debug = 0
[profile.test]
debug = 0

[lints.rust]
unexpected_cfgs = { level = "warn", check-cfg = ['cfg(myoxus_memory_probes)'] }
